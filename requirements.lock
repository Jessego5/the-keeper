# requirements.lock — the exact versions this Keeper was built and CALIBRATED on.
#
# Generated:  .venv/bin/python -m pip freeze --exclude-editable > requirements.lock
# Install:    pip install -r requirements.lock
#
# Why a lock matters more here than in most projects: several constants are tuned
# against specific model and library versions, not chosen on principle —
#
#   memory._REL_FLOOR = 0.17   the usable band measured only 0.138..0.199 against
#                              text-embedding-3 at this dimensionality
#   mood floor        = 0.15   tuned on evals/register_dataset.json for
#                              minishlab/potion-base-8M via model2vec
#
# so an unpinned upgrade can silently decalibrate them: nothing errors, the
# numbers just quietly stop meaning what mood_bench.py measured. If you do bump a
# version, re-run `python backend/mood_bench.py` and `pytest tests/evals -m eval`
# and move the constants if they have drifted.
#
# requirements.txt stays loose and human-readable; this file is what CI installs.
