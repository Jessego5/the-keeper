<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Keeper, demo</title>
<meta name="description" content="Two minutes of The Keeper: memory, a calendar event and an email that wait for a yes, and a line it decides to send on its own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,100,1;1,9..144,300..600,100,1&display=swap">
<style>
  :root { --deep:#080d16; --sea:#0d1827; --surface:#14283a; --foam:#cfdfe0;
          --foam-dim:#7e9da5; --tide:#5a8ea3; }
  * { box-sizing:border-box; }
  html { background:var(--deep); }
  body { margin:0; min-height:100vh; color:var(--foam);
         font-family:"Fraunces","Iowan Old Style",Georgia,serif;
         background:linear-gradient(180deg,var(--surface),var(--sea) 40%,var(--deep));
         background-attachment:fixed;
         display:flex; flex-direction:column; align-items:center; padding:48px 16px; }
  .label { font-variant:small-caps; letter-spacing:.18em; color:var(--tide); font-size:15px; }
  h1 { font-weight:400; font-style:italic; font-size:clamp(26px,4vw,38px); margin:10px 0 6px; }
  p { color:var(--foam-dim); font-style:italic; margin:0 0 28px; text-align:center; max-width:640px; }
  video { width:min(960px,100%); border-radius:10px; border:1px solid rgba(207,223,224,.12);
          box-shadow:0 18px 60px rgba(0,0,0,.45); background:var(--deep); }
  a { color:var(--tide); }
  footer { margin-top:28px; font-size:15px; color:var(--foam-dim); }
</style>
</head>
<body>
  <div class="label">the keeper</div>
  <h1>A companion that decides when to speak.</h1>
  <p>Two minutes, with sound: memory, a calendar event and an email that wait for a
     yes, and a line it decides to send on its own.</p>
  <video controls playsinline preload="metadata" poster="screenshots/demo-poster.png">
    <source src="media/the-keeper-demo.mp4" type="video/mp4">
    Your browser cannot play this video. <a href="media/the-keeper-demo.mp4">Download it</a>.
  </video>
  <footer><a href="https://github.com/Jessego5/the-keeper">github.com/Jessego5/the-keeper</a></footer>
</body>
</html>
