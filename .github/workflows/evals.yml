# The live tier: real models, real money, non-deterministic.
#
# MANUAL ONLY, by choice. Running this on a schedule would mean giving GitHub a
# copy of the OPENAI_API_KEY as a repository secret, and the decision was not to —
# the credential stays on the machine that owns it. The nightly trigger is removed
# rather than left failing, because a workflow that is always red teaches you to
# ignore red.
#
# The consequence is real and worth stating: nothing runs the eval tier unless a
# person does. Run it before anything that touches a prompt, a threshold or a
# parser:
#
#     .venv/bin/pytest tests/evals -m eval
#
# The API-key guard below stays, because it protects a manual run too: every eval
# is skipif on that key, so without it a run with no key passes zero tests and
# reports success.
name: Evals

on:
  workflow_dispatch:            # on demand only — see above

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Cache the Model2Vec weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-base-8m-${{ runner.os }}

      # Every eval is marked skipif no OPENAI_API_KEY. Without this guard a missing
      # secret produces a green run of zero tests — silence that looks like success,
      # which is the exact failure this tier exists to catch.
      - name: Require the API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set — every eval would skip and"
            echo "::error::this job would pass without testing anything."
            exit 1
          fi

      - name: Evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # retry.py now absorbs the 429s that made the recall-gate eval flake when
        # the whole tier ran at once; if flakes return, that is the thing to look at
        # rather than loosening an assertion.
        run: python -m pytest tests/evals -m eval -q

      # Voice fidelity. It scores lines across every mode and prints a number, and
      # until now nothing watched it: a prompt change could quietly degrade the
      # voice and no check would notice. Printed rather than asserted, for the same
      # reason mood_bench is — the number moves, and a threshold would either be
      # meaningless or flaky.
      - name: Voice fidelity harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/voice_test.py

      - name: Mood sensor benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Not an assertion — a printed record, so a decalibrated floor is visible
        # in the nightly log rather than discovered months later.
        run: python backend/mood_bench.py
