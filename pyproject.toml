[tool.pytest.ini_options]
# backend/ on the path so tests import modules directly (persona, energy, ...).
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, deterministic, no key/network/OS (Tier 1)",
    "integration: real subsystems — OS sensors, MCP, running app (Tier 2)",
    "eval: LLM behavior, needs OPENAI_API_KEY, non-deterministic rates (Tier 3)",
    "mac: requires macOS hardware signals",
]
# Default run excludes evals (they cost money and are non-deterministic).
# Run them explicitly with:  .venv/bin/pytest tests/evals -m eval
#
# -W error: a warning from our own code fails the run. The single ignore is a
# third-party leak — huggingface leaves config.json unclosed when model2vec loads
# — and narrowing it to ResourceWarning keeps every other warning fatal.
addopts = "-m 'not eval' -W error -W ignore::ResourceWarning"
