# One command:  docker compose up
# The Keeper at http://localhost:8790  (dashboard: /dashboard)
services:
  keeper:
    build: .
    ports:
      - "8790:8790"
    env_file:
      # OPENAI_API_KEY lives here (gitignored), and KEEPER_FEEDS — the
      # comma-separated feeds to watch. Unset means sources are off.
      - backend/.env
    volumes:
      # The ONLY host path exposed. Everything else the container can read is its
      # own image — which is the point: run_python cannot reach the host filesystem,
      # and the API key arrives as an env var above rather than as a file, so the
      # stripped child environment in sandbox.py leaves it nothing to read.
      - ./memory_store:/app/memory_store   # persist facts + reflections
    # The app never needs elevated privileges; dropping them costs nothing and
    # shrinks what a compromised run_python could attempt.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
